name: Publish tagged beta
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag matches packaged version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const assert = require("node:assert/strict"); assert.equal(process.env.RELEASE_TAG, "v" + require("./extension/manifest.json").version);'
      - run: npm test
      - run: python3 scripts/build.py
      - name: Create public beta release with packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip --verify-tag --prerelease --title "Single Screen View $RELEASE_TAG beta" --notes "Public beta. See README.md, PRIVACY.md and CHANGELOG.md for installation, current validation and limitations. Not store approved; browser compatibility varies."
