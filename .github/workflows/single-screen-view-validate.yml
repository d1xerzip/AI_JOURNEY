name: Single Screen View validation
on:
  push:
    paths: ['projects/single-screen-view/**', '.github/workflows/single-screen-view-*.yml']
  pull_request:
    paths: ['projects/single-screen-view/**', '.github/workflows/single-screen-view-*.yml']
permissions:
  contents: read
defaults:
  run:
    working-directory: projects/single-screen-view
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: python3 scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: single-screen-view-packages
          path: projects/single-screen-view/dist/*.zip
          if-no-files-found: error
